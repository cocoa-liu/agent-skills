<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>源码阅读导读</title>
<style>
:root{--paper:#f5f4ee;--panel:#fffefa;--ink:#19332d;--muted:#64736b;--line:#dce2d8;--green:#246550;--soft:#eaf0e6;--warm:#fbf0dc;--accent:#a56631;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.8 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--green);text-underline-offset:3px}button,input,textarea,select{font:inherit}button,a,summary,input,textarea,select{outline-offset:4px}button,summary{cursor:pointer}button{color:inherit}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}h1,h2,h3,h4,p{margin:0}h1{font-size:clamp(27px,3.2vw,42px);line-height:1.35;letter-spacing:-.03em}h2{font-size:24px;line-height:1.45}h3{font-size:18px}h4{font-size:16px}p+p{margin-top:12px}p,dd,li,h1,h2,h3,h4{overflow-wrap:anywhere}code{font-family:var(--mono);font-size:.88em}small,.small{font-size:13px}.muted{color:var(--muted)}.prose{white-space:pre-wrap}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;color:var(--green);margin-bottom:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;font-size:11px;line-height:1.7;padding:3px 9px;color:var(--muted)}.tag.observed{background:var(--soft);color:var(--green)}.tag.hypothesis{background:var(--warm);color:var(--accent)}
.sidebar{width:252px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:28px 20px;background:#eef0e7;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;line-height:1.4}.mark{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--green);color:white;font:16px var(--mono)}.brand small{display:block;font-weight:400;letter-spacing:.08em;color:var(--muted);font-size:10px;margin-top:5px}.snapshot{font:10px/1.8 var(--mono);color:var(--muted);margin:18px 0;overflow-wrap:anywhere}.nav{display:grid;gap:5px}.nav button,.station{border:0;background:transparent;text-align:left;border-radius:7px;padding:10px 12px}.nav button[aria-current=page],.station[aria-current=step]{background:var(--panel);color:var(--green)}.chapters{overflow:auto;margin-top:23px;min-height:0;flex:1}.chapters .small{margin-bottom:10px}.station{display:flex;gap:10px;width:100%;font-size:12px;line-height:1.5}.station .number{font-family:var(--mono);min-width:20px;color:var(--green)}.sidebar-bottom{margin-top:16px;border-top:1px solid var(--line);padding-top:15px}.progress{height:4px;border-radius:8px;background:var(--line);margin:8px 0 15px}.progress>div{height:100%;background:var(--green)}.mobile-select{display:none}
main{margin-left:252px;padding:0 44px 50px;max-width:1600px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:38px;font-size:12px;color:var(--muted)}#app{max-width:1100px;margin:auto}.hero{margin-bottom:26px}.hero .description{margin-top:18px;color:var(--muted);max-width:800px}.stack{display:grid;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;min-width:0}.panel>h3{margin-bottom:15px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.soft{padding:17px 20px;border-radius:9px;background:var(--soft);font-size:14px}.concept{background:var(--warm);border-left:3px solid var(--accent);padding:19px 22px;border-radius:0 10px 10px 0}.concept .eyebrow{color:var(--accent)}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:var(--panel);font-size:13px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.link{border:0;background:transparent;padding:4px 0;color:var(--green);text-decoration:underline;text-underline-offset:3px}.io{margin:0}.io>div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.io>div:last-child{border:0}.io dt{color:var(--muted);font-size:12px}.io dd{margin:0;font-size:14px}.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin:18px 0}.flow-node{padding:15px;border:1px solid var(--line);background:#f8f9f4;border-radius:9px;text-align:left;min-width:0}.flow-node strong,.flow-node small{display:block}.flow-node small{color:var(--muted);margin-top:5px}.flow-node[aria-pressed=true]{border-color:var(--green);background:var(--soft)}.flow-detail{border-top:1px solid var(--line);padding-top:16px}.before{color:var(--muted)}.after{padding:16px;border-radius:10px;background:var(--soft)}
.source-entry{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:12px;min-width:0}.source-entry>summary{padding:14px 17px;background:#f4f6ef;font-size:13px;overflow-wrap:anywhere}.source-entry>summary code{display:block;font-size:11px;color:var(--muted);padding-left:16px}.source-intro,.source-explanation{padding:20px}.source-intro h4{margin-bottom:8px}.source-example{padding:12px 15px;border-left:3px solid var(--accent);background:var(--warm);margin-top:15px;font-size:13px}.code-scroll{overflow:auto;max-width:100%;max-height:420px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f8f8f2}.code{font:12px/1.9 var(--mono);margin:0;padding:12px 0;white-space:pre;tab-size:4}.code-row{display:block;min-width:max-content;padding-right:18px}.line-number{display:inline-block;width:54px;text-align:right;padding-right:15px;color:#859084;user-select:none}.highlight{background:#e6edd7}.line-notes{list-style:none;padding:0;margin:15px 0;display:grid;gap:13px}.line-notes li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;font-size:13px}.source-check{border-top:1px solid var(--line);padding-top:12px;font-size:13px}.source-check p{padding-top:8px}.caution{color:var(--muted);font-size:12px;margin:15px 0}.checkpoint{border-top:3px solid var(--green)}.choices{display:grid;gap:8px;margin:18px 0}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:14px}.choice input{margin-top:7px;accent-color:var(--green)}.feedback{margin-top:15px;padding:14px 18px;background:var(--soft);border-radius:8px;font-size:13px}.feedback.wrong{background:var(--warm)}.note{display:block;margin-top:22px;font-size:12px;color:var(--muted)}textarea{width:100%;resize:vertical;min-height:90px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;margin-top:7px;color:var(--ink);font-size:13px}.page-footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font:10px/1.7 var(--mono);color:var(--muted);overflow-wrap:anywhere}.notice{padding:10px 15px;background:var(--warm);font-size:12px;margin-bottom:20px;border-radius:8px}.trace-index{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.trace-index button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:12px}.trace-index button[aria-current=step]{color:white;background:var(--green);border-color:var(--green)}.trace-value{font:14px/1.9 var(--mono);white-space:pre-wrap;padding:18px;background:var(--soft);border-radius:8px;margin:16px 0;overflow-wrap:anywhere}.evidence{border-top:1px solid var(--line);padding:16px 0}.evidence:first-of-type{border-top:0}.evidence .tag{margin-bottom:8px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}td{overflow-wrap:anywhere}.file-path{min-width:200px}
dialog{width:min(1120px,95vw);max-height:88vh;border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#19332d77}.dialog-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.dialog-header strong{font-size:13px;overflow-wrap:anywhere}dialog .code-scroll{max-height:68vh}dialog .small{padding:10px 20px}
@media(max-width:1000px){.sidebar{width:215px;padding:24px 14px}main{margin-left:215px;padding:0 24px 40px}.grid2{grid-template-columns:1fr}.panel{padding:21px}}
@media(max-width:700px){.sidebar{position:static;width:100%;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.snapshot,.chapters,.sidebar-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:15px}.nav button{font-size:12px;padding:8px 11px;white-space:nowrap}.mobile-select{display:block;width:100%;margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:12px}main{margin:0;padding:0 16px 35px}.topbar{height:56px;margin-bottom:24px}.panel{padding:18px}.io>div{grid-template-columns:65px minmax(0,1fr);gap:10px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-node{padding:11px;font-size:13px}.flow-node small{font-size:11px}.line-notes li{grid-template-columns:1fr;gap:4px}.source-intro,.source-explanation{padding:15px}.source-entry>summary{font-size:12px}.hero .description{font-size:13px}.btn{font-size:12px}.code{font-size:11px}h2{font-size:21px}.dialog-header{padding:12px}.dialog-header strong{font-size:11px}}
@media print{.sidebar,.topbar,button,textarea,.choices,.note,.page-footer{display:none!important}main{margin:0;padding:0}.panel{break-inside:avoid}body{background:white}.code-scroll{max-height:none}details.source-entry{display:block}}
__REVIEW_CSS__
</style>
</head>
<body>
<aside class="sidebar" aria-label="导读导航">
  <div class="brand"><span class="mark">&lt;/&gt;</span><div>源码阅读工作台<small>OVERVIEW → EXECUTION → MAINTENANCE</small></div></div>
  <div class="snapshot" id="snapshot"></div>
  <nav class="nav" aria-label="阅读方式"><button data-view="review">PR 阅读进度</button><button data-view="overview">整体轮廓</button><button data-view="block">逐块跟读</button><button data-view="trace">数据旅程</button><button data-view="maintenance">维护与证据</button></nav>
  <label><span class="mobile-select" style="border:0;padding:0">跳到一个逻辑块</span><select class="mobile-select" id="mobileBlock" aria-label="选择逻辑块"></select></label>
  <nav class="chapters" id="chapters" aria-label="建议阅读顺序"></nav>
  <div class="sidebar-bottom"><div class="row between small"><span>理解检查</span><span id="progressText"></span></div><div class="progress"><div id="progressFill"></div></div><button class="btn" data-action="export">导出回答与笔记</button></div>
</aside>
<main><header class="topbar"><span id="viewName">整体轮廓</span><div class="row"><span class="tag">离线可读</span><a id="projectLink" target="_blank" rel="noreferrer" hidden>查看原项目 ↗</a><button class="btn link" data-action="export">导出笔记</button></div></header><div class="notice" id="storageNotice" role="status" hidden></div><div id="app"></div><noscript>这个导读需要 JavaScript 展示内嵌源码和阅读步骤；运行过程不需要联网。</noscript></main>
<dialog id="sourceDialog" aria-labelledby="sourceTitle"><div class="dialog-header"><strong id="sourceTitle"></strong><button class="btn" data-action="close-source" aria-label="关闭源码">关闭 ×</button></div><div class="small muted" id="sourceSnapshot"></div><div class="code-scroll"><pre class="code" id="sourceCode"></pre></div></dialog>
<script id="guide-data" type="application/json">__GUIDE_DATA__</script>
<script>__REVIEW_SYNTAX__</script>
<script>__REVIEW_JS__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('guide-data').textContent);
const app = document.getElementById('app');
const labels = {observed:'实测 / 直接核对',derived:'由代码推导',historical:'历史结果',hypothesis:'假设 / 推测'};
const storageKey = 'code-reading-guide:v1:' + D.fingerprint;
let saved = {}, storageError = '';
try {const raw = JSON.parse(localStorage.getItem(storageKey) || '{}'); if(raw && typeof raw === 'object') saved = raw;} catch {storageError = '当前浏览器未能读取学习进度。可以继续阅读，并导出本次笔记。';}
const state = {view:'overview', block:0, flow:0, trace:0, answers:{}, notes:{}};
for(const block of D.blocks){const answer = saved.answers?.[block.id];if(answer && Number.isInteger(answer.choice) && answer.choice >= 0 && answer.choice < block.checkpoint.choices.length) state.answers[block.id] = {choice:answer.choice,checked:answer.checked===true};if(typeof saved.notes?.[block.id] === 'string') state.notes[block.id] = saved.notes[block.id];}
const escape = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const paragraphs = texts => texts.map(text => `<p class="prose">${escape(text)}</p>`).join('');
const tag = kind => `<span class="tag ${escape(kind)}">${escape(labels[kind])}</span>`;
const blockIndex = id => D.blocks.findIndex(block => block.id === id);
const complete = block => state.answers[block.id]?.checked === true && state.answers[block.id].choice === block.checkpoint.answer;
const blockButton = (id, title='到对应代码块 →') => `<button class="btn" data-block="${escape(id)}">${escape(title)}</button>`;
function io(caller,input,output,firstLabel='谁调用它'){return `<dl class="io"><div><dt>${escape(firstLabel)}</dt><dd class="prose">${escape(caller)}</dd></div><div><dt>输入</dt><dd class="prose">${escape(input)}</dd></div><div><dt>输出</dt><dd class="prose">${escape(output)}</dd></div></dl>`;}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({answers:state.answers,notes:state.notes}));}catch{storageError='当前浏览器无法保存进度；本次阅读仍可继续，请用“导出笔记”保存。';}showStorageNotice();}
function showStorageNotice(){const element=document.getElementById('storageNotice');element.hidden=!storageError;element.textContent=storageError;}
function footer(){return `<footer class="page-footer">${escape(D.snapshot.mode)} · head ${escape(D.snapshot.head.slice(0,12))}${D.snapshot.base?' · base '+escape(D.snapshot.base.slice(0,12)):''} · ${D.blocks.length} 个逻辑块 · 内容指纹 ${D.fingerprint.slice(0,12)}</footer>`;}
function overview(){const o=D.overview,s=o.scenario,n=o.flow[state.flow];return `<div class="hero"><div class="eyebrow">先建立轮廓 / overview first</div><h1>${escape(D.title)}</h1><p class="description prose">${escape(D.subtitle||o.summary)}</p>${D.audience?`<p class="small muted" style="margin-top:10px">适合：${escape(D.audience)}</p>`:''}</div><div class="stack"><section class="panel"><h3>这段代码解决什么问题？</h3>${paragraphs([o.problem,o.summary])}</section><section class="panel"><div class="row between"><h3>用同一个例子贯穿阅读</h3>${tag(s.basis)}</div><div class="soft prose" style="margin:16px 0"><b>输入</b>　${escape(s.input)}</div><div class="${s.before?'grid2':''}">${s.before?`<div class="before"><h4>原先的行为 / 限制</h4><p class="prose">${escape(s.before)}</p></div>`:''}<div class="after"><h4>${s.before?'改动后的行为':'执行后的结果'}</h4><p class="prose">${escape(s.after)}</p></div></div></section><section class="panel"><h3>先认识每块的职责</h3><p class="small muted">点击一块看输入输出，再进入执行细节。</p><div class="flow">${o.flow.map((node,index)=>`<button class="flow-node" data-flow="${index}" aria-pressed="${state.flow===index}"><strong>${index+1}. ${escape(node.name)}</strong><small>${escape(node.role)}</small></button>`).join('')}</div><div class="flow-detail" id="flowDetail"><h4>${escape(n.name)}</h4>${io(n.role,n.input,n.output,'职责')}${blockButton(n.block)}</div>${o.flow_note?`<p class="small muted prose" style="margin-top:16px">${escape(o.flow_note)}</p>`:''}</section><section class="panel"><h3>按执行流程读，每次停在一个逻辑块</h3><p class="small muted">先理解调用和数据变化，再展开源码。每段都有一个问题；页面会根据答案给出更小的例子或深入说明，由你决定何时继续。</p><div class="row" style="margin-top:18px">${blockButton(D.blocks[0].id,'开始第一个逻辑块 →')}<button class="btn" data-view="trace">先看数据旅程</button></div></section></div>${footer()}`;}
function codeLines(source,start,end,highlightStart=0,highlightEnd=0){return source.lines.slice(start-1,end).map((line,index)=>{const number=start+index;return `<span class="code-row ${number>=highlightStart&&number<=highlightEnd?'highlight':''}" data-line="${number}"><span class="line-number">${number}</span>${escape(line)}</span>`;}).join('');}
function referenceView(reference,index){const source=D.sources[reference.source],key=`${state.block}:${index}`;return `<details class="source-entry"><summary>${escape(reference.title)}<code>${escape(reference.version)} · ${escape(reference.path)}:${reference.start}–${reference.end}</code></summary><div class="source-intro"><h4>${escape(reference.title)}</h4><p class="small prose">${escape(reference.purpose)}</p>${io(reference.caller,reference.input,reference.output)}<div class="source-example prose"><b>具体例子</b><br>${escape(reference.example)}</div></div><div class="code-scroll"><pre class="code">${codeLines(source,reference.start,reference.end)}</pre></div><div class="source-explanation"><button class="btn link" data-ref="${key}">查看完整文件与上下文 ↗</button><ol class="line-notes">${reference.steps.map(step=>`<li><span><button class="btn link" data-ref="${key}" data-start="${step.start}" data-end="${step.end}">L${step.start}${step.end!==step.start?'–'+step.end:''}</button></span><span class="prose">${escape(step.text)}</span></li>`).join('')}</ol>${reference.caution?`<p class="caution prose"><b>维护边界：</b>${escape(reference.caution)}</p>`:''}<details class="source-check"><summary>${escape(reference.question)}</summary><p class="prose">${escape(reference.answer)}</p></details></div></details>`;}
function feedback(block){const answer=state.answers[block.id],checkpoint=block.checkpoint;if(!answer?.checked)return '';if(complete(block))return `<div class="feedback"><b>理解检查通过。</b><p class="prose">${escape(checkpoint.explanation)}</p><details style="margin-top:10px"><summary>进一步想想维护问题</summary><p class="prose">${escape(checkpoint.deeper)}</p></details></div>`;return `<div class="feedback wrong"><b>先缩小一步。</b><p class="prose">${escape(checkpoint.simpler)}</p><p>回到当前代码，再检查一次输入与输出。</p></div>`;}
function blockView(){const block=D.blocks[state.block],answer=state.answers[block.id],checkpoint=block.checkpoint;return `<div class="hero"><div class="eyebrow">${escape(block.phase)} / ${state.block+1} OF ${D.blocks.length}</div><h1>${escape(block.title)}</h1><p class="description prose">${escape(block.purpose)}</p></div><div class="stack"><section class="panel">${io(block.caller,block.input,block.output)}</section><section class="concept"><div class="eyebrow">最小例子 · ${escape(block.concept.name)}</div><p class="prose">${escape(block.concept.example)}</p></section><section class="panel"><h3>回到当前代码</h3>${paragraphs(block.explanation)}</section><section class="panel"><h3>按这个顺序找代码</h3><p class="small muted">每个片段都有自己的解释，默认收起；点击行号可查看准确上下文。</p>${block.refs.map(referenceView).join('')}</section><section class="panel checkpoint" data-checkpoint="${escape(block.id)}"><div class="eyebrow">停一下 · 用自己的话解释</div><h3>${escape(checkpoint.question)}</h3><div class="choices">${checkpoint.choices.map((choice,index)=>`<label class="choice"><input type="radio" name="checkpoint" value="${index}" ${answer?.choice===index?'checked':''}><span>${escape(choice)}</span></label>`).join('')}</div><button class="btn" data-action="check">检查理解</button><div id="feedback" role="status">${feedback(block)}</div><label class="note">我的理解或疑问<textarea data-note="${escape(block.id)}" placeholder="谁调用它？输入发生了什么变化？还有哪里不明白？">${escape(state.notes[block.id]||'')}</textarea></label><div class="row between" style="margin-top:18px">${state.block>0?blockButton(D.blocks[state.block-1].id,'← 上一个逻辑块'):'<span></span>'}${state.block<D.blocks.length-1?blockButton(D.blocks[state.block+1].id,complete(block)?'继续下一个逻辑块 →':'带着疑问继续 →'):'<button class="btn primary" data-view="maintenance">查看维护与证据 →</button>'}</div></section></div>${footer()}`;}
function traceView(){const step=D.trace[state.trace];return `<div class="hero"><div class="eyebrow">追踪同一份输入</div><h1>数据怎样走完整个执行过程？</h1><p class="description prose">${escape(D.overview.scenario.input)}</p></div><section class="panel"><div class="row between"><span class="small">STEP ${state.trace+1} / ${D.trace.length}</span>${tag(step.basis)}</div><nav class="trace-index" aria-label="执行步骤">${D.trace.map((entry,index)=>`<button data-trace="${index}" aria-current="${index===state.trace?'step':'false'}" aria-label="${index+1}. ${escape(entry.title)}">${index+1}</button>`).join('')}</nav><div id="tracePanel"><h2>${escape(step.title)}</h2><div class="trace-value">输入：${escape(step.input)}\n↓ ${escape(step.operation)}\n输出：${escape(step.output)}</div></div><div class="row between"><button class="btn" data-trace="${state.trace-1}" ${state.trace===0?'disabled':''}>← 上一步</button>${blockButton(step.block)}<button class="btn" data-trace="${state.trace+1}" ${state.trace===D.trace.length-1?'disabled':''}>下一步 →</button></div></section>${footer()}`;}
function maintenanceView(){return `<div class="hero"><div class="eyebrow">独立解释与维护</div><h1>从现象找到责任块。</h1><p class="description">先检查边界，再深入实现；把代码事实、数值推导与运行证据分开。</p></div><div class="stack">${D.maintenance.map(item=>`<section class="panel"><h3>${escape(item.symptom)}</h3><p class="prose">${escape(item.check)}</p><div class="soft prose" style="margin:15px 0"><b>怎样验证</b><br>${escape(item.verification)}</div>${blockButton(item.block)}</section>`).join('')}<section class="panel"><h3>结论与证据</h3>${D.evidence.map(item=>`<div class="evidence">${tag(item.kind)}<h4>${escape(item.claim)}</h4><p class="small muted prose">${escape(item.detail)}</p></div>`).join('')}${D.limitations?.length?`<div class="soft"><b>当前结论的边界</b><ul>${D.limitations.map(item=>`<li>${escape(item)}</li>`).join('')}</ul></div>`:''}</section><section class="panel"><h3>这份文档对应什么代码？</h3><p class="small muted">${D.snapshot.mode==='working-tree'?'工作区文件快照；HEAD 只标识基线，具体内容以文件摘要为准。':'源码直接读取固定 Git commit，与工作区未提交内容分开。'} 构建时间：${escape(D.built_at)}</p><div class="table-scroll"><table><thead><tr><th>来源与文件</th><th>版本</th><th>SHA256</th></tr></thead><tbody>${Object.values(D.sources).map(source=>`<tr><td class="file-path">${escape(source.version)} · ${escape(source.path)}</td><td><code>${escape(source.revision)}</code></td><td><code>${escape(source.sha256)}</code></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h3>保存自己的解释</h3><p class="small muted">导出每个逻辑块的答案和笔记，可继续用于讨论。不会自动发送到任何服务器。</p><button class="btn primary" style="margin-top:15px" data-action="export">导出学习记录</button></section></div>${footer()}`;}
function renderNavigation(){document.querySelectorAll('.nav [data-view]').forEach(button=>button.setAttribute('aria-current',button.dataset.view===state.view?'page':'false'));document.getElementById('chapters').innerHTML='<div class="small muted">建议阅读顺序</div>'+D.blocks.map((block,index)=>`<button class="station" data-block="${escape(block.id)}" aria-current="${state.view==='block'&&state.block===index?'step':'false'}"><span class="number">${complete(block)?'✓':String(index+1).padStart(2,'0')}</span><span>${escape(block.title)}</span></button>`).join('');const count=D.blocks.filter(complete).length;document.getElementById('progressText').textContent=`${count} / ${D.blocks.length}`;document.getElementById('progressFill').style.width=100*count/D.blocks.length+'%';document.getElementById('mobileBlock').value=state.view==='block'?D.blocks[state.block].id:'';if(state.view==='block'&&state.block+1<D.blocks.length){const next=app.querySelector('.checkpoint [data-block="'+D.blocks[state.block+1].id+'"]');if(next)next.textContent=complete(D.blocks[state.block])?'继续下一个逻辑块 →':'带着疑问继续 →';}}
function render(){document.body.classList.toggle('review-page',state.view==='review');document.getElementById('viewName').textContent={review:'PR 阅读进度',overview:'整体轮廓',block:'逐块跟读',trace:'数据旅程',maintenance:'维护与证据'}[state.view];if(state.view==='review'){app.innerHTML='<div id="pr-review-root"></div>';CodeReadingReview.mount(document.getElementById('pr-review-root'),D.review);}else{app.innerHTML={overview,block:blockView,trace:traceView,maintenance:maintenanceView}[state.view]();}renderNavigation();showStorageNotice();}
function route(){const [view,id]=location.hash.slice(1).split('/');if(view==='block'&&blockIndex(id)>=0){state.view='block';state.block=blockIndex(id);}else{state.view=['overview','trace','maintenance'].includes(view)?view:(D.review?.enabled?'review':'overview');}render();window.scrollTo(0,0);}
function go(view,id){const next=view==='block'?'block/'+(id||D.blocks[state.block].id):view;if(location.hash.slice(1)===next)route();else location.hash=next;}
function showSource(key,start,end){const [index,number]=key.split(':').map(Number),reference=D.blocks[index].refs[number],source=D.sources[reference.source];start=start||reference.start;end=end||reference.end;document.getElementById('sourceTitle').textContent=`${source.path}:${start}–${end}`;document.getElementById('sourceSnapshot').textContent=`${source.version} · ${source.revision} · SHA256 ${source.sha256}`;document.getElementById('sourceCode').innerHTML=codeLines(source,1,source.lines.length,start,end);document.getElementById('sourceDialog').showModal();document.querySelector('#sourceCode .highlight')?.scrollIntoView({block:'center'});}
function exportProgress(){const report={title:D.title,fingerprint:D.fingerprint,snapshot:D.snapshot,exported_at:new Date().toISOString(),blocks:D.blocks.map(block=>({id:block.id,title:block.title,question:block.checkpoint.question,selected:state.answers[block.id]?.choice??null,understood:complete(block),note:state.notes[block.id]||''}))};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='code-reading-progress.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const data=button.dataset;if(data.view){go(data.view);return;}if(data.block){go('block',data.block);return;}if(data.flow!==undefined){state.flow=Number(data.flow);render();return;}if(data.trace!==undefined){state.trace=Number(data.trace);render();return;}if(data.ref){showSource(data.ref,Number(data.start),Number(data.end));return;}if(data.action==='close-source'){document.getElementById('sourceDialog').close();return;}if(data.action==='export'){exportProgress();return;}if(data.action==='check'){const block=D.blocks[state.block],choice=app.querySelector('input[name=checkpoint]:checked');if(!choice){document.getElementById('feedback').textContent='先选择一个答案，再检查自己的理解。';return;}state.answers[block.id]={choice:Number(choice.value),checked:true};save();document.getElementById('feedback').innerHTML=feedback(block);renderNavigation();}});
document.addEventListener('input',event=>{if(event.target.matches('textarea[data-note]')){state.notes[event.target.dataset.note]=event.target.value;save();}});
document.addEventListener('change',event=>{if(event.target.id==='mobileBlock'&&event.target.value)go('block',event.target.value);if(event.target.matches('input[name=checkpoint]')){state.answers[D.blocks[state.block].id]={choice:Number(event.target.value),checked:false};document.getElementById('feedback').textContent='';save();renderNavigation();}});
document.addEventListener('toggle',event=>{if(event.target.matches('details.source-entry')&&event.target.open){app.querySelectorAll('details.source-entry[open]').forEach(element=>{if(element!==event.target)element.open=false;});}},true);
window.addEventListener('hashchange',route);
document.title=D.title;document.documentElement.lang=D.language||'zh-CN';document.getElementById('snapshot').textContent=`${D.snapshot.mode} / ${D.snapshot.head.slice(0,12)}\n一份输入，一次读一块。`;
document.getElementById('mobileBlock').innerHTML='<option value="">选择阅读步骤…</option>'+D.blocks.map((block,index)=>`<option value="${escape(block.id)}">${index+1}. ${escape(block.title)}</option>`).join('');
if(D.url){const link=document.getElementById('projectLink');link.href=D.url;link.hidden=false;}
document.querySelector('.nav [data-view=review]').hidden=!D.review?.enabled;
route();
</script>
</body>
</html>
